site_name: IBM i & z/OS Explorer
site_description: Documentation for the IBM i & z/OS Explorer extension for Visual Studio Code
site_author: Gaurav Gupta
site_url: https://gauravgupta0612.github.io/IBM-i-z-OS-Explorer-doc/
repo_url: https://github.com/gauravgupta0612/IBM-i-z-OS-Explorer
repo_name: IBM-i-z-OS-Explorer
edit_uri: https://github.com/gauravgupta0612/IBM-i-z-OS-Explorer-doc/edit/main/docs/
copyright: Copyright &copy; 2026 Gaurav Gupta · MIT License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.keys
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gauravgupta0612
      name: Gaurav Gupta on GitHub

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
  - Connections:
      - Overview: connections/index.md
      - IBM i: connections/ibmi.md
      - z/OS: connections/zos.md
      - Passwords & security: connections/security.md
  - z/OS:
      - Developer workflow: zos/developer-workflow.md
      - Data sets & members: zos/datasets.md
      - USS files: zos/uss.md
      - Jobs & JCL: zos/jobs.md
      - JCL templates & snippets: zos/jcl-templates.md
      - TSO & console: zos/commands.md
      - z/OSMF setup (sysprogs): zos/zosmf-setup.md
  - IBM i:
      - Libraries & members: ibmi/libraries.md
      - Library list: ibmi/library-list.md
      - Compile: ibmi/compile.md
      - CL & SQL: ibmi/cl-sql.md
      - IFS, spool & jobs: ibmi/ifs-spool-jobs.md
      - Message queues: ibmi/messages.md
      - PASE terminal: ibmi/terminal.md
  - Reference:
      - Commands & shortcuts: reference/commands.md
      - Settings: reference/settings.md
      - Productivity: reference/productivity.md
      - Editing & languages: reference/editing.md
      - Troubleshooting: reference/troubleshooting.md
  - Project:
      - Changelog: changelog.md
      - Releases & changelog process: project/releasing.md
      - Development: project/development.md
      - Architecture: project/architecture.md
